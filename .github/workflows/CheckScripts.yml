name: CheckScripts

# spell-checker:ignore ludeeus mfinelli shellcheck scandir shfmt

env:
  SCRIPT_DIR: 'util'

on:
  push:
    branches:
      - '*'
    paths:
      - 'util/**/*.sh'
  pull_request:
    branches:
      - main
    paths:
      - 'util/**/*.sh'

# End the current execution if there is a new changeset in the PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  shell_check:
    name: ShellScript/Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -s bash
        with:
          severity: warning
          scandir: ${{ env.SCRIPT_DIR }}
          format: tty

  shell_fmt:
    name: ShellScript/Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup shfmt
        uses: mfinelli/setup-shfmt@a25fda4c1fe115aec0f85e04126610841bc3141d # v4.0.1
      - name: Run shfmt
        shell: bash
        run: |
          # fmt options: bash syntax, 4 spaces indent, indent for switch-case
          echo "## show the differences between formatted and original scripts..."
          find ${{ env.SCRIPT_DIR }} -name "*.sh" -print0 | xargs -0 shfmt -ln=bash -i 4 -ci -d || true
