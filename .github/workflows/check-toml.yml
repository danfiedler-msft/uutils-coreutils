name: Check TOML files

# spell-checker:ignore (people) taiki-e
# spell-checker:ignore (misc) taplo tombi

on:
  push:
    paths:
      - "**.toml"
  pull_request:
    paths:
      - "**.toml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tombi
        uses: tombi-toml/setup-tombi@d8f3250344c4e9107b91c02bc11efcf72baf5793 # v1.7.3
      - name: Install taplo-cli
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: taplo-cli
      - name: Lint TOML files
        run: tombi lint --error-on-warnings
      - name: Format TOML files
        run: taplo fmt --check --diff
